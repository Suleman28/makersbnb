{% extends "base.html" %}
{% block title %}Create a New Listing | MakersBnB{% endblock %}
{% block content %}
<main class="flex items-center justify-center px-4 py-12">
    <form method="POST" action="/listings/new" id="new-listing-form" class="flex w-full max-w-sm flex-col gap-4 rounded-lg bg-white p-8 shadow-sm">
        <h1 class="mb-2 text-xl font-bold text-slate-900">Create a listing</h1>
        {% if error %}
          <p class="text-sm text-red-600">{{ error }}</p>
        {% endif %}

        <div class="flex flex-col gap-1">
          <label for="listing_name" class="text-sm font-medium text-slate-700">Listing name</label>
          <input type="text" name="listing_name" id="listing_name" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex gap-2">
          <div class="flex flex-col gap-1 flex-1">
            <label for="start_date" class="text-sm font-medium text-slate-700">Available from</label>
            <input type="date" name="start_date" id="start_date" required class="rounded-md border border-slate-300 px-3 py-2">
          </div>
          <div class="flex flex-col gap-1 flex-1">
            <label for="end_date" class="text-sm font-medium text-slate-700">Available until</label>
            <input type="date" name="end_date" id="end_date" required class="rounded-md border border-slate-300 px-3 py-2">
          </div>
        </div>
        <input type="hidden" name="listing_dates_available" id="listing_dates_available">

        <div class="flex flex-col gap-1">
          <label for="listing_price" class="text-sm font-medium text-slate-700">Price</label>
          <input type="number" step="0.01" min="0" name="listing_price" id="listing_price" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex flex-col gap-1">
          <label for="listing_image_url" class="text-sm font-medium text-slate-700">Image URL</label>
          <input type="url" name="listing_image_url" id="listing_image_url" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex flex-col gap-1">
          <label for="listing_description" class="text-sm font-medium text-slate-700">Description</label>
          <textarea name="listing_description" id="listing_description" rows="4" required class="rounded-md border border-slate-300 px-3 py-2"></textarea>
        </div>

        <button type="submit" class="mt-2 rounded-md bg-slate-900 px-4 py-2 text-white transition-colors hover:bg-slate-700">Create listing</button>
        <p class="text-sm text-slate-600 text-center"><a href="/listings" class="text-slate-900 font-medium hover:underline">Back to listings</a></p>
    </form>
</main>

<script>
document.getElementById('new-listing-form').addEventListener('submit', function () {
  const start = document.getElementById('start_date').value;
  const end = document.getElementById('end_date').value;
  document.getElementById('listing_dates_available').value = `${start} to ${end}`;
});
</script>
{% endblock %}
