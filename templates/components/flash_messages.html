{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mx-auto max-w-6xl px-6">
      {% for category, message in messages %}
        <p class="mt-4 rounded-md px-4 py-2 text-sm {% if category == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-700{% endif %}">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
