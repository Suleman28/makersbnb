{% extends "base.html" %}

{% block title %}Sign In | MakersBnB{% endblock %}

{% block content %}
<main class="flex items-center justify-center px-4 py-12">
    <form method="POST" action="/signin" class="flex w-full max-w-sm flex-col gap-4 rounded-lg bg-white p-8 shadow-sm">
        <h1 class="text-xl font-bold text-slate-900">Welcome back</h1>
        <p class="mb-2 text-sm font-normal text-slate-700">Sign in to your account</p>

        {% if error %}
          <p class="text-sm text-red-600">{{ error }}</p>
        {% endif %}

        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm font-medium text-slate-700">Email</label>
          <input type="email" name="email" id="email" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex flex-col gap-1">
          <label for="password" class="text-sm font-medium text-slate-700">Password</label>
          <input type="password" name="password" id="password" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <button type="submit" class="mt-2 rounded-md bg-slate-900 px-4 py-2 text-white transition-colors hover:bg-slate-700">Sign in</button>

        <p class="text-sm text-slate-600 text-center">Don't have an account? <a href="/signup" class="text-slate-900 font-medium hover:underline">Sign up</a></p>
    </form>
</main>
{% endblock %}
