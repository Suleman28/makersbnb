{% extends "base.html" %}

{% block title %}Sign Up | MakersBnB{% endblock %}

{% block content %}
<main class="flex items-center justify-center px-4 py-12">
    <form method="POST" action="/sign_up" class="flex w-full max-w-sm flex-col gap-4 rounded-lg bg-white p-8 shadow-sm">
        <h1 class="mb-2 text-xl font-bold text-slate-900">Sign up</h1>

        {% if error %}
          <p class="text-sm text-red-600">{{ error }}</p>
        {% endif %}

        <div class="flex flex-col gap-1">
          <label for="name" class="text-sm font-medium text-slate-700">Name</label>
          <input type="text" name="name" id="name" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm font-medium text-slate-700">Email</label>
          <input type="email" name="email" id="email" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex flex-col gap-1">
          <label for="password" class="text-sm font-medium text-slate-700">Password</label>
          <input type="password" name="password" id="password" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <div class="flex flex-col gap-1">
          <label for="password_confirmation" class="text-sm font-medium text-slate-700">Password confirmation</label>
          <input type="password" name="password_confirmation" id="password_confirmation" required class="rounded-md border border-slate-300 px-3 py-2">
        </div>

        <button type="submit" class="mt-2 rounded-md bg-slate-900 px-4 py-2 text-white transition-colors hover:bg-slate-700">Sign up</button>

        <p class="text-sm text-slate-600 text-center">Already have an account? <a href="/sign_in" class="text-slate-900 font-medium hover:underline">Sign in</a></p>
    </form>
</main>
{% endblock %}
