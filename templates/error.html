{% extends "base.html" %}

{% block title %}{{ code }} {{ heading }} | MakersBnB{% endblock %}

{% block content %}
<main class="relative isolate min-h-[calc(100vh-69px)]">
    <img
        src="https://images.unsplash.com/photo-1545972154-9bb223aac798?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=3050&q=80&exp=-20&con=-15&sat=-75"
        alt=""
        class="absolute inset-0 -z-10 size-full bg-slate-900 object-cover object-[50%_65%]"
    >
    <div class="mx-auto max-w-7xl px-6 py-32 text-center sm:py-40 lg:px-8">
        <p class="text-base/8 font-semibold text-white">{{ code }}</p>
        <h1 class="mt-4 text-5xl font-semibold tracking-tight text-balance text-white sm:text-7xl">{{ heading }}</h1>
        <p class="mt-6 text-lg font-medium text-pretty text-white/70 sm:text-xl/8">{{ message }}</p>
        <div class="mt-10 flex justify-center">
            <a href="/" class="text-sm/7 font-semibold text-white no-underline hover:text-white/90"><span aria-hidden="true">&larr;</span> Back to home</a>
        </div>
    </div>
</main>
{% endblock %}
